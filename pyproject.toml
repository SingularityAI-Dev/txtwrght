[project]
name = "hermd"
version = "0.1.0"
description = "CLI-first browser agent: headless, text-only DOM, zero screenshots"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hermd = "hermd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermd"]
